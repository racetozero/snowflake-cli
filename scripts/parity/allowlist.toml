"snow auth login" = "The success path is an interactive browser sign-in (OAuth authorization code with PKCE) against the account over HTTPS, followed by a second, caching connect; the plain-HTTP fake server cannot host it. The port implements the flow (sign-in target parsing, two connects, connection naming, writing the connection and default) and every pre-connection error path is covered by cases."

[deviations]
"snow --info" = "python_version, system_info and installation_source describe the runtime (CPython build string, platform.platform(), pypi vs binary); the port reports its own values. The case normalises these three fields."
"snow connection add token authenticators" = "Upstream stores the answer to 'Enter password' (or --password) as `password` also for PROGRAMMATIC_ACCESS_TOKEN and OAUTH, which read only `token`, so the new connection cannot sign in. The port stores it as `token`; when --authenticator names one of them the prompt is 'Enter token', and on a terminal an empty password followed by one of them asks for the token. Other prompts and their order are unchanged. When the login of a connection with a password and no token fails, the error also says how to fix it."
"token_file_path" = "Upstream sends the raw file content, so a final newline becomes part of the token. The port trims it, as upstream's own `snow ai` does."
"authenticators" = "Native Okta (https:// authenticators) and PAT_WITH_EXTERNAL_SESSION are not implemented and are refused with the supported values. EC keys are supported on P-256 and P-384, not P-521. An empty authenticator means SNOWFLAKE (upstream raises KeyError). OAuth and browser callbacks skip requests that are not the callback. Tokens are not cached."
"snow upgrade" = "Self-upgrade exists only for upstream's snowflake-managed direct install (shim + versioned layout). The Rust binary reports installation_source `binary`, so it always takes the refusal path; the cases normalise the channel name."
"snow ai oauth_authorization_code" = "Upstream renews OAuth tokens through a helper that re-executes the Python interpreter (`python -I -m snowflake.cli._plugins.ai.oauth`); its standalone (frozen) builds refuse with `Renewable OAuth is not yet supported by standalone Snow CLI executables.` The Rust binary is standalone and gives the same refusal. PAT and static OAuth paths are identical."
"yaml syntax errors" = "PyYAML's scanner/parser error messages (`while parsing a flow sequence ... in \"<file>\", line 1, column 18`) and exception class names are not reproduced; the port reports the yaml-rust2 message. Cases with malformed YAML normalise the message body and error class."
"telemetry" = "In-band telemetry (/telemetry/send) is excluded from comparison. The port sends a smaller payload of its own design (command path, output format, duration, status, error class)."
"python warnings" = "warnings.warn() prefixes the Python source file:line and echoes the source line; the port prints `UserWarning: <message>`. The checker normalises the Python form (`file.py:N: XWarning: msg` + indented source line) to the same shape."
"logs" = "The log file under SNOWFLAKE_HOME/logs is written by both but excluded from comparison (timestamps, Python logger names)."
"snow stage execute .py files" = "Upstream registers a Snowpark @sproc (cloudpickled function uploaded by Snowpark) to run staged Python files. The port creates an equivalent temporary Python procedure with inline source (same behaviour: os.environ updated from variables, file exec'd). SQL differs; cases cover .sql files only."
"snow spcs service logs --follow / snow logs --refresh" = "Polling loops (until Ctrl+C) are ported but cannot be exercised by the checker, which needs commands to exit."
"connector tracebacks" = "When the connector logs an HTTP failure with exc_info=True, Python prints a site-packages traceback; the port prints the message line only and the checker strips Python traceback blocks from stderr before comparing."
"python runtime features" = "Features that need a Python runtime are not supported by the standalone binary: the 'native app setup' artifact processor (flag ENABLE_NATIVE_APP_PYTHON_SETUP; it builds a venv with the CLI's own interpreter and pip-installs snowflake-app-python) fails with a clear UnsupportedArtifactProcessorError; snow feature (snowflake-ml-python), external plugins and snow cortex search (Python < 3.12 only) behave as upstream does without those libraries (see [allow])."
"snowpark processor interpreter" = "The native-app snowpark processor runs the callback script with VIRTUAL_ENV/bin/python3, `conda run`, or python3/python from PATH exactly as upstream. Upstream's last fallback and `env.type: current` use sys.executable (the CLI's own interpreter), which a standalone binary does not have: the Rust port looks up python3/python on PATH instead and warns 'No Python executable found' when there is none. Python json.loads error texts are reproduced for the common cases (Expecting value / Extra data) only."
"sar parallel uploads" = "snow app deploy (Snowflake App Runtime) uploads bundle files with 5 parallel PUTs on the same session, upstream and port alike, printing each 'Uploaded X -> Y' line in completion order; cases compare those lines with sort_lines."
"sql repl rendering" = "The snow sql REPL uses a raw-mode line editor on a terminal (crossterm) instead of prompt_toolkit: cursor editing, history in <config dir>/repl_history (FileHistory format), Tab completion of keywords, functions, types and catalog names (the same scoped SHOW queries as upstream, cached until !rehash), keyword/string/number/comment highlighting, Ctrl-C drops the input, Ctrl-D and exit ask with single-key y/n. Screen redraws, completion menus and colours differ from prompt_toolkit; piped input is read line by line. REPL cases compare stderr, exit code and SQL."
"workload identity options" = "Workload identity attestation covers AWS (environment, web identity token file, assume-role profiles, shared credentials/config file, credential_process, ECS container and EC2 instance metadata credentials; workload_identity_impersonation_path role chaining, workload_identity_aws_use_outbound_token, workload_identity_host; SigV4 verified against botocore), Azure (managed identity, Azure Functions, AKS workload identity, single-hop service principal impersonation, workload_identity_entra_resource) and GCP (metadata identity token, service account impersonation chain). AWS SSO profiles (legacy and sso-session) use the token cached by `aws sso login`, refreshing sso-session tokens within 15 minutes of expiry like botocore. Cloud metadata and token endpoints are exercised by unit stubs, not by the checker."
"per-account cert probe" = "The Snowflake App Runtime per-account certificate probe uses rustls with the webpki roots (TLS 1.3) where upstream uses ssl with the certifi bundle; NotValidForName/Expired map to NOT_PROVISIONED and every other failure is UNKNOWN, as upstream classifies verify codes 10/62. Cases use an unresolvable domain, so both sides report UNKNOWN."
