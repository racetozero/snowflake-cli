# Leaf commands, or aspects of them, that cannot be byte-identical between the
# Python reference and the Rust port. Every entry carries the reason; each is
# also recorded in the Decision Log of the ExecPlan that owns the command.
#
# [allow] maps a leaf command path to a reason; the checker reports it as ALLOW.
# [deviations] documents partial differences inside otherwise-checked commands.

[allow]
"snow spcs image-repository list-tags" = "Deprecated; talks to the image registry over hard-coded https (https://<repository_url>/v2/...), which the plain-HTTP fake server cannot serve. Implemented (registry login with the session token, paginated tags/list); only the repository-lookup error path is covered by a case."
"snow cortex search" = "Upstream enables search only on Python < 3.12 (SEARCH_COMMAND_ENABLED); on the 3.12 reference the command is hidden and always raises, so there is no success path to compare. The port reproduces the 3.12 behaviour (covered by cases)."
"snow plugin enable" = "External plugins are Python packages registered as entry points; the Rust binary cannot load them, so no plugin is ever installed and only the not-installed path exists (covered by cases)."
"snow plugin disable" = "Same as snow plugin enable."
"snow feature init" = "Every snow feature command delegates to the optional snowflake-ml-python[feature_store] library (decl_api), which upstream imports lazily and which a standalone binary cannot load; without it upstream raises `Error: 'snow feature' requires the snowflake-ml-python[feature_store] library`. The port reproduces that path (covered by cases); there is no success path to compare."
