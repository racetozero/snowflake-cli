[[case]]
name = "ai claude pat"
# Only a login happens before the agent is launched.
offline_success = true
covers = ["snow ai claude"]
connection = true
config = "authenticator = \"PROGRAMMATIC_ACCESS_TOKEN\"\ntoken = \"pat-secret\""
bins = { "claude" = "#!/bin/sh\n{ echo \"args:\"; for a in \"$@\"; do echo \"  [$a]\"; done\n  for v in ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_CUSTOM_HEADERS CLAUDE_CODE_ENABLE_TELEMETRY OTEL_TRACES_EXPORTER OPENCODE_CONFIG_CONTENT KEEP_ME; do eval \"echo $v=\\${$v-<unset>}\"; done; } > agent.log\necho agent stdout\nexit ${AGENT_EXIT:-0}\n" }
env = { KEEP_ME = "1", ANTHROPIC_CUSTOM_HEADERS = "x-snowflake-application: mine\nOther: 2" }
argv = ["ai", "claude", "--agent-args", "-p", "explain this repo", "--verbose"]

