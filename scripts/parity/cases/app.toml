[[case]]
name = "app version list"
covers = ["snow app version list"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts: [setup.sql]\n  app:\n    type: application\n    identifier: my_app\n    from:\n      target: pkg\n", "setup.sql" = "" }
rules = [{ match = "show versions in application package", columns = ["version", "patch", "label", "comment", "created_on", "dropped_on", "log_level", "trace_level", "state", "review_status"], rows = [["V1", 0, "<NULL>", "<NULL>", "2024-01-01", "<NULL>", "OFF", "OFF", "READY", "NOT_REVIEWED"]] }]
argv = ["app", "version", "list"]

[[case]]
name = "app release-directive list"
covers = ["snow app release-directive list"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts: [setup.sql]\n    meta:\n      role: pkg_role\n", "setup.sql" = "" }
rules = [{ match = "show release directives", columns = ["name", "target_type", "version", "patch"], rows = [["DEFAULT", "<NULL>", "V1", 0], ["MY_DIR", "ACCOUNT", "V1", 1]] }]
argv = ["app", "release-directive", "list", "--like", "MY%"]

[[case]]
name = "app release-channel list"
covers = ["snow app release-channel list"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts: [setup.sql]\n", "setup.sql" = "" }
rules = [{ match = "bootstrap_data_request", columns = ["x"], rows = [["{\"clientParamsInfo\": [{\"name\": \"FEATURE_RELEASE_CHANNELS\", \"value\": true}]}"]] }, { match = "show release channels", columns = ["name", "description", "created_on", "updated_on", "targets", "versions"], rows = [["QA", "qa channel", "<NULL>", "<NULL>", "{\"accounts\": [\"ORG.ACC\"]}", "[\"V1\"]"]] }]
argv = ["app", "release-channel", "list"]

[[case]]
name = "app release-channel list json"
covers = ["snow app release-channel list"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts: [setup.sql]\n", "setup.sql" = "" }
rules = [{ match = "bootstrap_data_request", columns = ["x"], rows = [["{\"clientParamsInfo\": [{\"name\": \"FEATURE_RELEASE_CHANNELS\", \"value\": true}]}"]] }, { match = "show release channels", columns = ["name", "description", "created_on", "updated_on", "targets", "versions"], rows = [["QA", "qa channel", "<NULL>", "<NULL>", "{}", "[\"V1\", \"V2\"]"]] }]
argv = ["app", "release-channel", "list", "--format", "json"]

