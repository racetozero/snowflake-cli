[[case]]
name = "app bundle children"
covers = ["snow app bundle"]
connection = true
files = { "app/manifest.yml" = "manifest_version: 1\nartifacts:\n  setup_script: setup.sql\n", "app/setup.sql" = "create application role app_public;\n", "st.py" = "import streamlit\n", "pages/p1.py" = "x\n", "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts:\n      - src: app/*\n        dest: ./\n    children:\n      - target: my_st\n        identifier:\n          schema: v_schema\n        ensure_usable_by:\n          application_roles: [\"app_user\"]\n  my_st:\n    type: streamlit\n    identifier: my_st\n    query_warehouse: wh\n    main_file: st.py\n    title: T\n    artifacts: [st.py]\n  fn:\n    type: function\n    identifier: f\n    handler: a.b\n    returns: string\n    signature: []\n    artifacts: [st.py]\n    stage: s\n" }
env = { SNOWFLAKE_CLI_FEATURES_ENABLE_NATIVE_APP_CHILDREN = "true" }
argv = ["app", "bundle"]

