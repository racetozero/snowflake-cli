[[case]]
name = "app bundle snowpark processor ast shapes"
covers = ["snow app bundle"]
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts:\n      - src: app/*\n        dest: ./\n      - src: src/*.py\n        dest: ./py/\n        processors: [snowpark]\n", "app/manifest.yml" = "manifest_version: 1\nartifacts:\n  setup_script: setup.sql\n", "app/setup.sql" = "select 1;\n", "src/mod.py" = "import functools\nfrom snowflake.snowpark.functions import udf, udtf\n\ndecos = [udf]\n\n@udf(name=\"a1\")\nasync def ahandler(x):\n    return x\n\n@udtf(output_schema=[\"a\"])\n@functools.lru_cache\nclass Tab:\n    @udf\n    def inner(self):\n        pass\n\n@decos[0]\ndef sub(x):\n    return x\n\ndef outer():\n    @udf(\n        name=\"nested\",\n        packages=[\"a\", \"b\"],\n    )\n    def nested(x):\n        return x\n    return nested\n" }
bins = { "python3" = "#!/bin/sh\ncat > /dev/null\ncat <<'JSON'\n[{\"type\": \"function\", \"handler\": \"ahandler\", \"returns\": \"STRING\", \"signature\": [], \"runtime\": \"3.11\"}, {\"type\": \"table function\", \"handler\": \"Tab\", \"returns\": \"TABLE(A INT)\", \"signature\": [], \"runtime\": 3.1}, {\"type\": \"function\", \"handler\": \"sub\", \"returns\": \"INT\", \"signature\": [], \"runtime\": \"3.11\"}, {\"type\": \"function\", \"handler\": \"nested\", \"returns\": \"INT\", \"signature\": [{\"name\": \"x\", \"type\": \"INT\", \"default\": \"1\"}], \"runtime\": \"3.11\", \"imports\": [\"/abs.zip\"], \"external_access_integrations\": [\"e\"], \"secrets\": {\"a b\": \"s\"}}, {\"type\": \"aggregate function\", \"handler\": \"inner\", \"returns\": \"INT\", \"signature\": [], \"name\": \"agg\", \"application_roles\": [\"r1\"]}, {\"type\": \"procedure\", \"handler\": \"x\", \"returns\": \"INT\", \"signature\": [], \"extra\": 1}]\nJSON\n" }
normalize = [["/private<", "<"]]
argv = ["app", "bundle"]
