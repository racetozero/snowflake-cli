[[case]]
name = "app bundle snowpark processor"
covers = ["snow app bundle"]
files = { "app/manifest.yml" = "manifest_version: 1\nartifacts:\n  setup_script: setup.sql\n", "app/setup.sql" = "create application role app_public;\n", "src/echo.py" = "from snowflake.snowpark.functions import udf, sproc\n\n@udf(\n    name=\"echo\",\n    native_app_params={\"schema\": \"core\"},\n)\ndef echo(a: str) -> str:\n    return a\n\n@sproc(name='p1')\ndef run(session):\n    return 1\n\n@staticmethod\ndef untouched():\n    pass\n", "src/other.py" = "x = 1\n", "snowflake.yml" = "definition_version: 2\nentities:\n  pkg:\n    type: application package\n    identifier: my_pkg\n    artifacts:\n      - src: app/*\n        dest: ./\n      - src: src/*.py\n        dest: ./py/\n        processors: [snowpark]\n" }
bins = { "python3" = "#!/bin/sh\ncat > sandbox_input.txt\ncat <<'JSON'\n[{\"type\": \"function\", \"lineno\": 4, \"name\": \"echo\", \"handler\": \"echo\", \"imports\": [\"lib/missing.zip\", \"@st/x.zip\"], \"packages\": [\"numpy\", \"snowflake-snowpark-python>=1.0\"], \"runtime\": \"3.11\", \"returns\": \"STRING\", \"signature\": [{\"name\": \"a\", \"type\": \"STRING\"}, {\"name\": \"b\", \"type\": \"INT\", \"default\": \"5\"}], \"external_access_integrations\": [\"eai1\"], \"secrets\": {\"k\": \"sec1\"}, \"schema\": \"core\", \"application_roles\": [\"app_public\", \"app_admin\"]}, {\"type\": \"procedure\", \"lineno\": 10, \"name\": null, \"handler\": \"run\", \"imports\": [], \"packages\": [], \"runtime\": \"3.11\", \"returns\": \"INT\", \"signature\": [], \"external_access_integrations\": [], \"secrets\": {}, \"execute_as_caller\": true}, {\"type\": \"table function\", \"lineno\": 10, \"name\": \"tf\", \"handler\": \"run\", \"imports\": [], \"packages\": [\"'snowflake-snowpark-python'\"], \"runtime\": \"3.11\", \"returns\": \"TABLE(A INT)\", \"signature\": [], \"schema\": \"My Schema.x\"}, {\"type\": \"function\", \"handler\": \"bad\"}]\nJSON\nexit 0\n" }
normalize = [["/private<", "<"]]
argv = ["app", "bundle"]

