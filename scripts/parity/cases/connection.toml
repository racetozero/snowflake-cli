timeout = 60
argv = ["connection", "generate-workload-identity-token", "-c", "k"]

[[case]]
name = "generate-workload-identity-token aws env creds"
covers = ["snow connection generate-workload-identity-token"]
config = "[connections.k]\naccount = \"a\"\nworkload_identity_provider = \"aws\"\n"
env = { AWS_REGION = "us-west-2", AWS_ACCESS_KEY_ID = "AKIDEXAMPLE", AWS_SECRET_ACCESS_KEY = "SECRET" }
normalize = [["^\\S+$", "<TOKEN>"]]
argv = ["connection", "generate-workload-identity-token", "-c", "k"]

[[case]]
name = "generate-workload-identity-token aws shared file"
covers = ["snow connection generate-workload-identity-token"]
config = "[connections.k]\naccount = \"a\"\nworkload_identity_provider = \"AWS\"\n"
env = { AWS_REGION = "eu-central-1", AWS_SHARED_CREDENTIALS_FILE = "<CWD>/creds" }
files = { "creds" = "[default]\naws_access_key_id = AKFILE\naws_secret_access_key = S2\naws_session_token = T2\n" }
