[[case]]
name = "connection list"
covers = ["snow connection list"]
connection = true
compare = ["stdout", "stderr", "exit"]
argv = ["connection", "list"]

[[case]]
name = "connection list json"
covers = ["snow connection list"]
connection = true
compare = ["stdout", "stderr", "exit"]
argv = ["connection", "list", "--format", "json"]

[[case]]
name = "connection list connections.toml"
covers = ["snow connection list"]
home_files = { "connections.toml" = { mode = "600", text = "[a]\naccount = \"x\"\npassword = \"secret\"\nport = 1\n[b]\nuser = \"u\"\n" } }
argv = ["connection", "list", "--format", "csv"]

[[case]]
name = "connection list empty"
covers = ["snow connection list"]
argv = ["connection", "list"]

[[case]]
name = "connection add non interactive"
covers = ["snow connection add"]
compare_config = true
argv = ["connection", "add", "-n", "new", "--account", "acc", "--user", "u", "--port", "1234", "--no-interactive", "--default"]

[[case]]
name = "connection add existing"
covers = ["snow connection add"]
connection = true
argv = ["connection", "add", "-n", "dev", "--account", "acc", "--no-interactive"]

[[case]]
name = "connection add interactive"
covers = ["snow connection add"]
compare_config = true
stdin = "conn1\nmyacc\nme\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
argv = ["connection", "add", "--password", "pw"]

[[case]]
name = "connection add missing key file"
covers = ["snow connection add"]
argv = ["connection", "add", "-n", "x", "-k", "/nonexistent.p8", "--no-interactive"]

[[case]]
name = "connection add to connections.toml"
covers = ["snow connection add"]
compare_config = true
home_files = { "connections.toml" = { mode = "600", text = "[a]\naccount = \"x\"\n" } }
argv = ["connection", "add", "-n", "b", "--account", "y", "--no-interactive"]

[[case]]
name = "connection remove"
covers = ["snow connection remove"]
connection = true
compare_config = true
argv = ["connection", "remove", "dev"]

[[case]]
name = "connection remove missing"
covers = ["snow connection remove"]
argv = ["connection", "remove", "nope"]

[[case]]
name = "connection set-default"
covers = ["snow connection set-default"]
connection = true
compare_config = true
config = "[connections.other]\naccount = \"o\"\n"
argv = ["connection", "set-default", "other"]

[[case]]
name = "connection set-default missing"
covers = ["snow connection set-default"]
argv = ["connection", "set-default", "nope"]

[[case]]
name = "connection test"
covers = ["snow connection test"]
connection = true
argv = ["connection", "test"]

[[case]]
name = "connection test json"
covers = ["snow connection test"]
connection = true
argv = ["connection", "test", "--format", "json"]

[[case]]
name = "connection test temporary"
covers = ["snow connection test"]
server = true
argv = ["connection", "test", "-x", "--account", "a", "--user", "u", "--password", "p", "--host", "127.0.0.1", "--port", "<PORT>", "--protocol", "http"]

[[case]]
name = "connection test login failure"
covers = ["snow connection test"]
connection = true
config = "[connections.bad]\naccount = \"a\"\nuser = \"u\"\npassword = \"wrong\"\nhost = \"127.0.0.1\"\nport = <PORT>\nprotocol = \"http\"\n"
argv = ["connection", "test", "-c", "bad"]

[[case]]
name = "connection test unknown connection"
covers = ["snow connection test"]
argv = ["connection", "test", "-c", "nope"]

[[case]]
name = "generate-jwt missing user"
covers = ["snow connection generate-jwt"]
config = "[connections.k]\naccount = \"a\"\n"
argv = ["connection", "generate-jwt", "-c", "k"]

[[case]]
name = "generate-workload-identity-token missing provider"
covers = ["snow connection generate-workload-identity-token"]
config = "[connections.k]\naccount = \"a\"\n"
argv = ["connection", "generate-workload-identity-token", "-c", "k"]

