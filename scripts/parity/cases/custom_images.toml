[[case]]
name = "custom-image validate pass"
covers = ["snow custom-image validate"]
bins = { "docker" = "#!/bin/sh\necho \"$@\" >> docker.log\ncase \"$1\" in\n  inspect) [ 0 -ne 0 ] && { echo \"Error: No such object\" >&2; exit 1; }; cat <<'J'\n[{\"Config\": {\"Entrypoint\": [\"/usr/local/bin/entrypoint.sh\"], \"Env\": [\"PATH=/bin\", \"DASHBOARD_PORT=12003\"]}}]\nJ\n  ;;\n  run)\n    for a in \"$@\"; do last=\"$a\"; done\n    case \"$last\" in\n      \"pip list --format json\") echo '[{\"name\": \"ipykernel\"}, {\"name\": \"sqlparse\"}, {\"name\": \"jinja2\"}, {\"name\": \"notebook\"}, {\"name\": \"ipython\"}, {\"name\": \"psutil\"}, {\"name\": \"snowflake_snowpark_python\"}, {\"name\": \"jupyter-server\"}, {\"name\": \"ray\"}, {\"name\": \"lightgbm-ray\"}, {\"name\": \"xgboost-ray\"}, {\"name\": \"snowflake\"}, {\"name\": \"snowflake.core\"}, {\"name\": \"snowflake-connector-python\"}, {\"name\": \"snowflake-ml-python\"}]';;\n      \"pip check\") printf '%s\\n' \"\"; exit 0;;\n      *) exit 0;;\n    esac;;\nesac\n" }
argv = ["custom-image", "validate", "myimg:1"]

