[[case]]
sort_sql = true
name = "dbt deploy both profiles long values"
covers = ["snow dbt deploy"]
connection = true
stages = true
files = { "p/dbt_project.yml" = "profile: pr\n", "p/profiles.yml" = "pr:\n  target: t\n  outputs:\n    t: {type: snowflake, database: d, schema: s, role: '{{ x }}'}\n", "conf/profiles.yml" = "pr: {}\n", "conf/dbt_projects_profiles.yml" = "pr:\n  target: t\n  outputs:\n    t:\n      type: snowflake\n      database: d\n      schema: s\n      role: '{{ x }}'\n      query_tag: this is a very long query tag value that will certainly need to be folded by the yaml emitter at eighty columns\n      created: 2024-01-05\n      at: 2024-01-05T10:20:30Z\n      enabled: yes\n      mode: 0755\n" }
rules = [{ match = "describe dbt project", error = { code = 2003, message = "DBT PROJECT 'P1' does not exist or not authorized." } }]
argv = ["dbt", "deploy", "p1", "--source", "p", "--profiles-dir", "conf"]
normalize = [['DBT_PROJECT_P1_[0-9]+_STAGE', 'DBT_PROJECT_P1_N_STAGE'], ['file:///\S+/\*', 'file://<TMP>/*'], ['dbt_project_p1_[0-9]+_stage', 'dbt_project_p1_n_stage']]
