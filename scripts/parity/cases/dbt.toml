[[case]]
sort_sql = true
name = "dbt deploy create"
covers = ["snow dbt deploy"]
connection = true
stages = true
files = { "proj/dbt_project.yml" = "name: p\nprofile: my_profile\n", "proj/models/a.sql" = "select 1\n", "proj/profiles.yml" = "my_profile:\n  target: dev\n  outputs:\n    dev:\n      type: snowflake\n      database: db\n      schema: s\n      role: '{{ env_var(\"R\") }}'\n      threads: 4\n      password: secret\n" }
rules = [{ match = "describe dbt project", error = { code = 2003, message = "DBT PROJECT 'P1' does not exist or not authorized." } }]
argv = ["dbt", "deploy", "p1", "--source", "proj", "--external-access-integration", "eai1", "--default-target", "dev"]
normalize = [['DBT_PROJECT_P1_[0-9]+_STAGE', 'DBT_PROJECT_P1_N_STAGE'], ['file:///\S+/\*', 'file://<TMP>/*'], ['dbt_project_p1_[0-9]+_stage', 'dbt_project_p1_n_stage']]

[[case]]
sort_sql = true
name = "dbt deploy alter"
covers = ["snow dbt deploy"]
connection = true
stages = true
files = { "dbt_project.yml" = "profile: pr\n", "profiles.yml" = "pr:\n  target: prod\n  outputs:\n    prod: {type: snowflake, database: d, schema: s, role: r1}\n" }
rules = [{ match = "describe dbt project", columns = ["name", "default_target", "external_access_integrations", "default_writeback"], rows = [["P1", "dev", "[EAI1]", "false"]] }, { match = "select current_role", columns = ["CURRENT_ROLE()"], rows = [["R1"]] }]
argv = ["dbt", "deploy", "p1", "--default-target", "prod", "--install-local-deps", "--default-writeback", "--unset-default-env"]
normalize = [['DBT_PROJECT_P1_[0-9]+_STAGE', 'DBT_PROJECT_P1_N_STAGE'], ['file:///\S+/\*', 'file://<TMP>/*'], ['dbt_project_p1_[0-9]+_stage', 'dbt_project_p1_n_stage']]

[[case]]
sort_sql = true
name = "dbt deploy force bad role"
covers = ["snow dbt deploy"]
connection = true
files = { "dbt_project.yml" = "profile: pr\n", "profiles.yml" = "pr:\n  target: prod\n  outputs:\n    prod: {type: snowflake, database: d, role: nope}\n" }
rules = [{ match = "use role nope", error = { code = 2003, message = "Role 'NOPE' does not exist" } }]
argv = ["dbt", "deploy", "p1", "--force"]

