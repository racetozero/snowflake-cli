[[case]]
name = "dcm list-deployments"
covers = ["snow dcm list-deployments"]
connection = true
files = { "m/manifest.yml" = "manifest_version: 2\ntype: dcm_project\ndefault_target: a\ntargets:\n  a:\n    project_name: p1\n  b:\n    project_name: p2\n" }
normalize = [["(Completed|Failed) \\(\\d+s\\)", "\\1 (Ns)"]]
argv = ["dcm", "list-deployments", "--from", "m", "--target", "b"]

[[case]]
name = "dcm list-deployments bad manifest"
covers = ["snow dcm list-deployments"]
connection = true
files = { "manifest.yml" = "manifest_version: 1\ntype: dcm_project\n" }
normalize = [["(Completed|Failed) \\(\\d+s\\)", "\\1 (Ns)"]]
argv = ["dcm", "list-deployments", "p"]

[[case]]
