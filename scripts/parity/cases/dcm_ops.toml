[[case]]
name = "dcm refresh"
covers = ["snow dcm refresh"]
connection = true
files = { "manifest.yml" = "manifest_version: 2\ntype: DCM_PROJECT\ntargets:\n  dev:\n    project_name: db.s.proj\n    account_identifier: myorg-myacc\n    project_owner: owner_role\n    templating_config: prod\ntemplating:\n  configurations:\n    prod:\n      x: 1\ndefault_target: dev\n" }
rules = [{ match = "REFRESH ALL", columns = ["result"], rows = [["{\"dts_refresh_result\": {\"refreshed_tables\": [{\"table_name\": \"DB.S.T1\", \"statistics\": {\"inserted_rows\": 1500, \"deleted_rows\": 0}}, {\"table_name\": \"DB.S.T2\", \"statistics\": {\"inserted_rows\": 0, \"deleted_rows\": 0}}, {\"table_name\": \"DB.S.T3\", \"statistics\": {\"inserted_rows\": 2500000, \"deleted_rows\": 12}}]}}"]] }, { match = "CURRENT_ORGANIZATION_NAME", columns = ["ORG", "ACCT"], rows = [["MYORG", "MYACC"]] }, { match = "select current_role", columns = ["CURRENT_ROLE()"], rows = [["OWNER_ROLE"]] }]
normalize = [["(Completed|Failed) \\(\\d+s\\)", "\\1 (Ns)"]]
argv = ["dcm", "refresh"]

