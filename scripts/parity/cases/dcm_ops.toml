[[case]]
name = "dcm preview"
covers = ["snow dcm preview"]
connection = true
files = { "manifest.yml" = "manifest_version: 2\ntype: DCM_PROJECT\ntargets:\n  dev:\n    project_name: db.s.proj\n    account_identifier: myorg-myacc\n    project_owner: owner_role\n    templating_config: prod\ntemplating:\n  configurations:\n    prod:\n      x: 1\ndefault_target: dev\n", "sources/definitions/a.sql" = "define table t(a int);\n", "sources/definitions/b.sql" = "x\n", "sources/macros/m.sql" = "m\n", "sources/.hidden/h.sql" = "h\n", "sources/top.sql" = "t\n" }
rules = [{ match = "PREVIEW", columns = ["A", "B"], rows = [[1, "x"]] }, { match = "CURRENT_ORGANIZATION_NAME", columns = ["ORG", "ACCT"], rows = [["MYORG", "MYACC"]] }, { match = "select current_role", columns = ["CURRENT_ROLE()"], rows = [["OWNER_ROLE"]] }]
stages = true
sort_sql = true
normalize = [["(?i)DCM_PROJ_\\d+_TMP_STAGE", "DCM_PROJ_<TS>_TMP_STAGE"], ["file://\\S+?/\\d+/\\*", "file://<TMPDIR>/<N>/*"], ["(Completed|Failed) \\(\\d+s\\)", "\\1 (Ns)"]]
argv = ["dcm", "preview", "--object", "db.s.t", "--limit", "5", "-D", "a=1"]
