files = { "index.js" = "x\n", "snowflake.yml" = "definition_version: 2\nentities:\n  a:\n    type: snowflake-app\n    identifier: myapp\n    artifacts: [index.js]\n" }
rules = [{ match = "GET_DEFAULT_APP_SPACE", error = { code = 2003, message = "Unknown function" } }, { match = "GET_APPLICATION_SERVICE_DEFAULTS", error = { code = 2140, message = "SQL compilation error: Unknown function SYSTEM$GET_APPLICATION_SERVICE_DEFAULTS" } }, { match = "SHOW PARAMETERS LIKE", columns = ["key", "value", "level"], rows = [["DEFAULT_SNOWFLAKE_APPS_DESTINATION_DATABASE", "ADB", "ACCOUNT"], ["DEFAULT_SNOWFLAKE_APPS_QUERY_WAREHOUSE", "AWH", ""]] }, { match = "EXPLAIN_PRIVILEGES", columns = ["R"], rows = [["{\"allOf\": [{\"privilege\": \"USAGE\", \"objectType\": \"DATABASE\", \"objectName\": \"ADB\"}]}"]] }, { match = "CURRENT_USER", columns = ["P"], rows = [["USER$TEST_USER"]] }, { match = "DESCRIBE APPLICATION SERVICE", columns = ["name"], rows = [] }]
argv = ["app", "teardown", "--force"]

