covers = ["snow app deploy"]
connection = true
stages = true
sort_sql = true
timeout = 120
files = { "index.js" = "x\n", "app.yml" = "version: 2\nignore: [index.js]\nname: my_app\ndatabase: db\nschema: s\nquery_warehouse: wh\n" }
rules = [{ match = "SHOW STAGES LIKE", columns = ["name"], rows = [] }, { match = "CREATE STAGE", error = { code = 3001, message = "boom" } }]
normalize = [["\\[\\d\\d:\\d\\d:\\d\\d\\]", "[TS]"], ["/private<", "<"]]
argv = ["app", "deploy", "--upload-only"]

