[[case]]
name = "snowpark build"
covers = ["snow snowpark build"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nmixins:\n  base:\n    stage: dev_deployment\n    artifacts: [app/]\nentities:\n  hello_function:\n    type: function\n    identifier: hello_function\n    handler: functions.hello_function\n    signature:\n      - name: name\n        type: string\n    returns: string\n    meta:\n      use_mixins: [base]\n  hello_procedure:\n    type: procedure\n    identifier: hello_procedure\n    handler: procedures.hello_procedure\n    signature:\n      - name: name\n        type: string\n        default: world\n    returns: string\n    execute_as_caller: true\n    meta:\n      use_mixins: [base]\n", "app/functions.py" = "def hello_function(name):\n    return 'Hello ' + name\ndef hello_function(name):\n    return 'Hello ' + name\ndef hello_function(name):\n    return 'Hello ' + name\ndef hello_function(name):\n    return 'Hello ' + name\ndef hello_function(name):\n    return 'Hello ' + name\n", "app/procedures.py" = "def hello_procedure(session, name):\n    return name\n", "app/sub/util.py" = "X = 1\n" }
argv = ["snowpark", "build"]

