[[case]]
name = "snowpark package upload"
covers = ["snow snowpark package upload"]
connection = true
files = { "pkg.zip" = "zipdata" }
stages = true
normalize = [["file://\\S+/pkg.zip", "file://<TMPDIR>/pkg.zip"]]
argv = ["snowpark", "package", "upload", "-f", "pkg.zip", "-s", "db.s.st/sub"]

[[case]]
name = "snowpark package upload exists"
covers = ["snow snowpark package upload"]
connection = true
files = { "pkg.zip" = "zipdata" }
stages = true
stage_files = { "st/pkg.zip" = "zipdata" }
normalize = [["file://\\S+/pkg.zip", "file://<TMPDIR>/pkg.zip"]]
argv = ["snowpark", "package", "upload", "-f", "pkg.zip", "-s", "st"]

[[case]]
name = "snowpark package upload missing"
covers = ["snow snowpark package upload"]
connection = true
argv = ["snowpark", "package", "upload", "-f", "nope.zip", "-s", "st"]
