[[case]]
name = "snowpark package lookup available"
covers = ["snow snowpark package lookup"]
connection = true
rules = [{ match = "information_schema.packages", columns = ["PACKAGE_NAME", "VERSION"], rows = [["pandas", "1.5.3"], ["pandas", "2.0.3"], ["pandas", "2.1.0rc1"], ["Snowflake-Snowpark-Python", "1.9.0"], ["weird", "notaversion"], ["weird", "1.0"]] }]
argv = ["snowpark", "package", "lookup", "pandas"]

