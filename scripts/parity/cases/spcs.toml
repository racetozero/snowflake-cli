[[case]]
name = "service create"
covers = ["snow spcs service create"]
connection = true
files = { "spec.yml" = "spec:\n  containers:\n  - name: main\n    image: /db/s/r/img:latest\n    args: ['$$x']\n" }
argv = ["spcs", "service", "create", "svc", "--compute-pool", "p", "--spec-path", "spec.yml", "--eai-name", "e1", "--eai-name", "e2", "--query-warehouse", "wh", "--comment", "c", "--max-instances", "2"]

[[case]]
name = "service execute-job"
covers = ["snow spcs service execute-job"]
connection = true
files = { "spec.yml" = "spec:\n  containers:\n  - name: main\n    image: img\n" }
argv = ["spcs", "service", "execute-job", "job1", "--compute-pool", "p", "--spec-path", "spec.yml", "--async", "--replicas", "2"]

[[case]]
