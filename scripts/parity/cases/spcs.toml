[[case]]
name = "compute pool create"
covers = ["snow spcs compute-pool create"]
connection = true
argv = ["spcs", "compute-pool", "create", "pool1", "--family", "CPU_X64_XS", "--max-nodes", "3", "--tag", "team=data", "--comment", "it's mine", "--init-suspend"]

[[case]]
name = "compute pool create defaults if not exists"
covers = ["snow spcs compute-pool create"]
connection = true
argv = ["spcs", "compute-pool", "create", "pool1", "--family", "F", "--no-auto-resume", "--if-not-exists", "--format", "json"]

[[case]]
name = "compute pool create exists"
covers = ["snow spcs compute-pool create"]
connection = true
argv = ["spcs", "compute-pool", "create", "pool1", "--family", "F"]
rules = [{ match = "CREATE COMPUTE POOL", error = { code = "002002", message = "SQL compilation error:\nObject 'POOL1' already exists.", sqlState = "42710" } }]

