connection = true
argv = ["spcs", "service", "suspend", "\"Svc\""]

[[case]]
name = "image registry login fake docker"
covers = ["snow spcs image-registry login"]
connection = true
files = { "bin/docker" = { mode = "755", text = "#!/bin/sh\necho \"docker $@\"\ncat\necho\necho Login Succeeded\n" } }
env = { PATH = "<CWD>/bin:/usr/bin:/bin" }
argv = ["spcs", "image-registry", "login"]
rules = [{ match = "show image repositories in schema snowflake.images", columns = ["name", "repository_url"], rows = [["IMAGES", "org-acc.registry.snowflakecomputing.com/a/b/c"]] }]

[[case]]
name = "service logs"
covers = ["snow spcs service logs"]
connection = true
argv = ["spcs", "service", "logs", "svc", "--container-name", "main", "--instance-id", "0", "--num-lines", "3", "--include-timestamps"]
rules = [{ match = "GET_SERVICE_LOGS", columns = ["SYSTEM$GET_SERVICE_LOGS"], rows = [["line one\nline two\n"]] }]

[[case]]
name = "service logs follow conflict"
covers = ["snow spcs service logs"]
connection = true
argv = ["spcs", "service", "logs", "svc", "--container-name", "main", "--instance-id", "0", "--follow", "--previous-logs"]

[[case]]
name = "service events"
covers = ["snow spcs service events"]
connection = true
argv = ["spcs", "service", "events", "db.s.svc", "--since", "1 hour", "--last", "5"]
rules = [
  { match = "show parameters like 'event_table'", columns = ["key", "value"], rows = [["EVENT_TABLE", "db.s.events"]] },
  { match = "record_type = 'EVENT'", columns = ["TIMESTAMP", "START_TIMESTAMP", "OBSERVED_TIMESTAMP", "TRACE", "RESOURCE", "RESOURCE_ATTRIBUTES", "SCOPE", "SCOPE_ATTRIBUTES", "RECORD_TYPE", "RECORD", "RECORD_ATTRIBUTES", "VALUE", "EXEMPLARS"], rows = [["2024-01-01", "<NULL>", "<NULL>", "<NULL>", "<NULL>", "{\"snow.database.name\": \"DB\", \"snow.service.name\": \"SVC\", \"snow.service.instance\": \"0\"}", "<NULL>", "<NULL>", "EVENT", "{\"name\": \"CONTAINER.STATUS_CHANGE\", \"severity_text\": \"INFO\"}", "<NULL>", "{\"message\": \"Running\"}", "<NULL>"]] },
]

[[case]]
name = "service events none"
covers = ["snow spcs service events"]
connection = true
argv = ["spcs", "service", "events", "svc", "--container-name", "main", "--instance-id", "0", "--first", "2", "--all"]
rules = [{ match = "show parameters like 'event_table'", columns = ["key", "value"], rows = [["EVENT_TABLE", "ev"]] }, { match = "record_type = 'EVENT'", columns = ["TIMESTAMP"], rows = [] }]

[[case]]
name = "service events no table"
covers = ["snow spcs service events"]
connection = true
argv = ["spcs", "service", "events", "svc"]
rules = [{ match = "show parameters like 'event_table'", columns = ["key", "value"], rows = [] }]

[[case]]
name = "service metrics latest"
covers = ["snow spcs service metrics"]
connection = true
argv = ["spcs", "service", "metrics", "db.s.svc", "--container-name", "main", "--instance-id", "0", "--format", "json"]
rules = [
  { match = "show parameters like 'event_table'", columns = ["key", "value"], rows = [["EVENT_TABLE", "ev"]] },
  { match = "rankedmetrics", columns = ["TIMESTAMP", "START_TIMESTAMP", "OBSERVED_TIMESTAMP", "TRACE", "RESOURCE", "RESOURCE_ATTRIBUTES", "SCOPE", "SCOPE_ATTRIBUTES", "RECORD_TYPE", "RECORD", "RECORD_ATTRIBUTES", "VALUE", "EXEMPLARS"], rows = [["2024-01-01", "<NULL>", "<NULL>", "<NULL>", "<NULL>", "{\"snow.service.container.instance\": \"0\"}", "<NULL>", "<NULL>", "METRIC", "{\"metric\": {\"name\": \"container.cpu.usage\"}}", "<NULL>", "{\"double_value\": 0.5}", "<NULL>"]] },
]

[[case]]
name = "service metrics range"
covers = ["snow spcs service metrics"]
connection = true
argv = ["spcs", "service", "metrics", "svc", "--container-name", "main", "--instance-id", "0", "--since", "2 hours", "--until", "1 hour"]
rules = [{ match = "show parameters like 'event_table'", columns = ["key", "value"], rows = [["EVENT_TABLE", "ev"]] }, { match = "record_type = 'METRIC'", columns = ["TIMESTAMP"], rows = [] }]

[[case]]
name = "image-repository list-tags missing"
covers = ["snow spcs image-repository list-tags"]
connection = true
argv = ["spcs", "image-repository", "list-tags", "repo", "--image-name", "org/db/s/repo/img"]
rules = [{ match = "show image repositories", columns = ["name", "repository_url"], rows = [] }]

[[case]]
name = "remote-build-status"
covers = ["snow spcs service remote-build-status"]
connection = true
argv = ["spcs", "service", "remote-build-status", "--job-name", "job$1"]
rules = [{ rest = "GET /api/v2/remote-build/jobs/job", body = { job_name = "JOB$1", job_status = "RUNNING", creation_time = "2024-01-01T00:00:00Z" } }]

[[case]]
name = "remote-build-status missing"
covers = ["snow spcs service remote-build-status"]
connection = true
argv = ["spcs", "service", "remote-build-status", "--job-name", "nope"]
rules = [{ rest = "GET /api/v2/remote-build/jobs/nope", status = 404, body = { message = "not found" } }]

[[case]]
name = "remote-build-history"
covers = ["snow spcs service remote-build-history"]
connection = true
argv = ["spcs", "service", "remote-build-history", "--page-size", "2", "--format", "json"]
rules = [{ rest = "GET /api/v2/remote-build/jobs\\?limit=2$", body = { jobs = [{ job_name = "A", job_status = "DONE", creation_time = "t1", end_time = "t2" }], next_page_token = "MTAw" } }, { rest = "GET /api/v2/remote-build/jobs\\?limit=2&page_token=MTAw", body = { jobs = [{ job_name = "B", job_status = "FAILED" }] } }]

[[case]]
name = "remote-build-history empty"
covers = ["snow spcs service remote-build-history"]
connection = true
argv = ["spcs", "service", "remote-build-history"]
rules = [{ rest = "GET /api/v2/remote-build/jobs", body = { jobs = [] } }]

[[case]]
name = "remote-build-status forbidden"
covers = ["snow spcs service remote-build-status"]
connection = true
argv = ["spcs", "service", "remote-build-status", "--job-name", "j"]
rules = [{ rest = "GET /api/v2/remote-build/jobs/j", status = 403, body = { message = "forbidden" } }]

[[case]]
name = "remote-build-history bad request"
covers = ["snow spcs service remote-build-history"]
connection = true
argv = ["spcs", "service", "remote-build-history"]
rules = [{ rest = "GET /api/v2/remote-build/jobs", status = 400, body = { message = "bad" } }]

[[case]]
name = "remote-build-history conflict"
covers = ["snow spcs service remote-build-history"]
connection = true
argv = ["spcs", "service", "remote-build-history"]
rules = [{ rest = "GET /api/v2/remote-build/jobs", status = 409, body = { message = "conflict" } }]
