connection = true
argv = ["spcs", "service", "status", "svc"]
rules = [{ match = "SYSTEM\\$GET_SERVICE_STATUS", columns = ["SYSTEM$GET_SERVICE_STATUS"], rows = [["[{\"status\":\"READY\",\"message\":\"Running\",\"containerName\":\"main\"}]"]] }]

