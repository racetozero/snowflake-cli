normalize = [["build_image_[0-9a-f]{8}", "build_image_<UUID>"], ["file://\\S+?/\\d+/\\*", "file://<TMPDIR>/<N>/*"]]
argv = ["spcs", "service", "build-image", "--compute-pool", "pool", "--image-repository", "db.s.repo", "--image-name", "my_img", "--image-tag", "v1", "--build-context-dir", "ctx", "--stage", "st", "--job-name", "my_job", "--eai-name", "e1"]

