[[case]]
name = "spcs service deploy"
covers = ["snow spcs service deploy"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  svc:\n    type: service\n    identifier: my_svc\n    stage: svc_stage\n    compute_pool: my_pool\n    spec_file: spec.yml\n    min_instances: 1\n    max_instances: 2\n    query_warehouse: wh\n    external_access_integrations: [eai_one]\n    comment: hello\n    artifacts:\n      - spec.yml\n      - src/app.py\n", "spec.yml" = "spec:\n  containers: []\n", "src/app.py" = "print(1)\n" }
stages = true
argv = ["spcs", "service", "deploy"]

[[case]]
name = "spcs service deploy upgrade"
covers = ["snow spcs service deploy"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  svc:\n    type: service\n    identifier: my_svc\n    stage: svc_stage\n    compute_pool: my_pool\n    spec_file: spec.yml\n    min_instances: 1\n    max_instances: 2\n    query_warehouse: wh\n    external_access_integrations: [eai_one]\n    comment: hello\n    artifacts:\n      - spec.yml\n      - src/app.py\n", "spec.yml" = "spec:\n  containers: []\n", "src/app.py" = "print(1)\n" }
stages = true
argv = ["spcs", "service", "deploy", "--upgrade"]

