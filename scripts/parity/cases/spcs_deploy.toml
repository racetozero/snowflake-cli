[[case]]
name = "spcs compute-pool deploy exists"
covers = ["snow spcs compute-pool deploy"]
connection = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  pool:\n    type: compute-pool\n    identifier: my_pool\n    min_nodes: 2\n    instance_family: CPU_X64_XS\n    comment: \"it's mine\"\n    tags:\n      - name: env\n        value: dev\n" }
rules = [{ match = "CREATE COMPUTE POOL", error = { code = 2002, message = "already exists" } }]
argv = ["spcs", "compute-pool", "deploy"]

