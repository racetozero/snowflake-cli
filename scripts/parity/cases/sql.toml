[[case]]
name = "sql legacy edge"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select '&&', '&1abc', '& x', '&A_b9', &{a}, &{ a }", "-D", "a=1", "-D", "A_b9=z"]

[[case]]
name = "sql templating all"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select '&a', '<% a %>', {{ 1 + 1 }}", "--enable-templating", "ALL", "-D", "a=1"]

[[case]]
name = "sql dedent and blank"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "    select 1;\n    select 2;\n;\n  ;"]

[[case]]
name = "sql command first line"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "!queries amount=3; select 3;"]

[[case]]
name = "sql put"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select 1 -- x\n; /* c */ select 2 /* d */;"]

[[case]]
name = "sql queries rest"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select 1;\n!queries\n!queries amount=3 user=u warehouse=w duration=5 type=select status=failed start=10 end=20 session"]
normalize = [["_dc=[0-9.]+", "_dc=X"]]

[[case]]
name = "sql queries rows"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "!queries start_date=2024-01-01T00:00:00 end_date=2024-01-02", "--format", "json"]
normalize = [["_dc=[0-9.]+", "_dc=X"]]
rules = [{ rest = "GET /monitoring/queries", body = { data = { queries = [{ id = "q1", sqlText = "select 1", state = "SUCCEEDED", totalDuration = 12 }, { id = "q2", sqlText = "select 2", state = "FAILED", totalDuration = 3 }] } } }]

[[case]]
name = "sql result"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "!result 01234567-89ab-cdef-0123-456789abcdef"]

[[case]]
name = "sql spool existing broad"
covers = ["snow sql"]
connection = true
files = { "out.txt" = { text = "old\n", mode = "644" } }
argv = ["sql", "-q", "!spool out.txt\nselect 1;"]

[[case]]
name = "sql spool into dir"
covers = ["snow sql"]
connection = true
files = { "d/x" = "" }
argv = ["sql", "-q", "!spool d\nselect 1;"]

[[case]]
name = "sql three json with commands"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select 1;\n!queries help\nselect 2;> select 3;", "--format", "json"]

