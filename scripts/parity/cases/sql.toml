[[case]]
name = "sql ctx env override"
covers = ["snow sql"]
connection = true
env = { FOO = "fromenv" }
argv = ["sql", "-q", "select '<% ctx.env.FOO %>', '<% ctx.env.BAR %>'", "--env", "FOO=over", "--env", "BAR=b"]

[[case]]
name = "sql template filters"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select '<% name | upper %>', '<% name ~ \"x\" %>', <%n%>", "-D", "name=bob", "-D", "n= 5 "]

[[case]]
name = "sql template syntax error"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select <% a + %>", "-D", "a=1"]

[[case]]
name = "sql template attr on str"
