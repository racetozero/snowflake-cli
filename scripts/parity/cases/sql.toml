connection = true
argv = ["sql", "-q", "select 1;\n!set output_format=table\nselect 2;", "--format", "csv"]

[[case]]
name = "sql enhanced exit"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "!foo", "--enhanced-exit-codes"]

[[case]]
name = "sql jinja comments protected"
covers = ["snow sql"]
connection = true
argv = ["sql", "-q", "select 1; -- {{ x }}\n/* {% if %} */ select '{{ a }}'; select '--' as c", "--enable-templating", "JINJA", "-D", "a=A"]

[[case]]
name = "sql jinja source"
covers = ["snow sql"]
connection = true
files = { "inc.sql" = "{% for i in [1,2] %}select {{ i }};{% endfor %}\n" }
argv = ["sql", "-q", "!source inc.sql", "--enable-templating", "jinja"]
