  { match = "system\\$get_snowsight_host", columns = ["RESULT"], rows = [["https://app.snowflake.com"]] }, { match = "return_current_org_name", columns = ["RESULT"], rows = [["myorg"]] }, { match = "current_account_name", columns = ["RESULT"], rows = [["MYACC"]] },
  { match = "describe streamlit", columns = ["name", "runtime_name", "compute_pool"], rows = [["APP", "SYSTEM$ST_CONTAINER_RUNTIME_PY3_11", "POOL"]] },
