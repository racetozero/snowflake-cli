[[case]]
name = "ws bundle streamlit"
covers = ["snow ws bundle"]
connection = true
offline_success = true
files = { "snowflake.yml" = "definition_version: 2\nentities:\n  s:\n    type: streamlit\n    identifier: st1\n    query_warehouse: wh\n    main_file: app.py\n    artifacts: [app.py]\n", "app.py" = "x" }
argv = ["ws", "bundle", "--entity-id", "s"]

